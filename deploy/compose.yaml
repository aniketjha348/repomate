# RepoMate local deployment (Phase 5 topology).
#
# - api:      FastAPI service; dispatches runs to the worker when
#             REPOMATE_EXECUTION=celery, otherwise executes in-process
# - worker:   Celery worker running the pipeline + verification sandbox
# - redis:    Celery broker
# - postgres: system of record when REPOMATE_DATABASE_URL points here
#             (omit it to use the built-in SQLite/file store instead)

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://vyceai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4.1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      REPOMATE_MAX_RUN_SECONDS: ${REPOMATE_MAX_RUN_SECONDS:-900}
      REPOMATE_EXECUTION: ${REPOMATE_EXECUTION:-inproc}
      REDIS_URL: redis://redis:6379/0
      REPOMATE_DATABASE_URL: ${REPOMATE_DATABASE_URL:-}
    volumes:
      - repomate-runs:/var/lib/repomate
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      REPOMATE_DATABASE_URL: ${REPOMATE_DATABASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REPOMATE_WORKER_CONCURRENCY: ${REPOMATE_WORKER_CONCURRENCY:-2}
    volumes:
      - repomate-runs:/var/lib/repomate
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repomate
      POSTGRES_USER: repomate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomate -d repomate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - repomate-db:/var/lib/postgresql/data
    # Point services at PostgreSQL with:
    #   REPOMATE_DATABASE_URL=postgresql://repomate:${POSTGRES_PASSWORD}@postgres:5432/repomate

volumes:
  repomate-runs:
  repomate-db:
