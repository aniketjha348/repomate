# RepoMate local deployment (Phase 5 topology).
#
# - api:      FastAPI service; dispatches runs to the worker when
#             REPOMATE_EXECUTION=celery, otherwise executes in-process
# - worker:   Celery worker running the pipeline + verification sandbox
# - redis:    Celery broker
# - postgres: system of record when REPOMATE_DATABASE_URL points here
#             (omit it to use the built-in SQLite/file store instead)

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    # The default Docker seccomp profile blocks the namespace syscalls
    # bubblewrap needs for the verification sandbox. This profile is Docker's
    # default plus namespace/mount syscalls; without it the sandbox fails
    # closed and repository tests are NOT_RUN.
    security_opt:
      - seccomp=./seccomp-bwrap.json
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-gemma4:31b,gpt-oss:120b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      REPOMATE_MAX_RUN_SECONDS: ${REPOMATE_MAX_RUN_SECONDS:-900}
      REPOMATE_EXECUTION: ${REPOMATE_EXECUTION:-inproc}
      REPOMATE_RATE_LIMIT_REQUESTS: ${REPOMATE_RATE_LIMIT_REQUESTS:-20}
      REPOMATE_RATE_LIMIT_WINDOW_SECONDS: ${REPOMATE_RATE_LIMIT_WINDOW_SECONDS:-60}
      REPOMATE_MAX_CONCURRENT_RUNS: ${REPOMATE_MAX_CONCURRENT_RUNS:-2}
      REPOMATE_TRUSTED_PROXIES: ${REPOMATE_TRUSTED_PROXIES:-}
      REPOMATE_MODEL_MAX_CALLS: ${REPOMATE_MODEL_MAX_CALLS:-10}
      REPOMATE_MODEL_MAX_TOKENS: ${REPOMATE_MODEL_MAX_TOKENS:-120000}
      REPOMATE_TOOL_MAX_CALLS: ${REPOMATE_TOOL_MAX_CALLS:-8}
      REPOMATE_TOOL_MAX_TOTAL_BYTES: ${REPOMATE_TOOL_MAX_TOTAL_BYTES:-4000000}
      REPOMATE_TOOL_MAX_SECONDS: ${REPOMATE_TOOL_MAX_SECONDS:-180}
      REPOMATE_TOOL_MAX_RESULTS: ${REPOMATE_TOOL_MAX_RESULTS:-20}
      REDIS_URL: redis://redis:6379/0
      REPOMATE_DATABASE_URL: ${REPOMATE_DATABASE_URL:-}
    volumes:
      - repomate-runs:/var/lib/repomate
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    security_opt:
      - seccomp=./seccomp-bwrap.json
    environment:
      REDIS_URL: redis://redis:6379/0
      REPOMATE_DATABASE_URL: ${REPOMATE_DATABASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-gemma4:31b,gpt-oss:120b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      REPOMATE_MAX_RUN_SECONDS: ${REPOMATE_MAX_RUN_SECONDS:-900}
      REPOMATE_MAX_CONCURRENT_RUNS: ${REPOMATE_MAX_CONCURRENT_RUNS:-2}
      REPOMATE_WORKER_CONCURRENCY: ${REPOMATE_WORKER_CONCURRENCY:-2}
      REPOMATE_MODEL_MAX_CALLS: ${REPOMATE_MODEL_MAX_CALLS:-10}
      REPOMATE_MODEL_MAX_TOKENS: ${REPOMATE_MODEL_MAX_TOKENS:-120000}
      REPOMATE_TOOL_MAX_CALLS: ${REPOMATE_TOOL_MAX_CALLS:-8}
      REPOMATE_TOOL_MAX_TOTAL_BYTES: ${REPOMATE_TOOL_MAX_TOTAL_BYTES:-4000000}
      REPOMATE_TOOL_MAX_SECONDS: ${REPOMATE_TOOL_MAX_SECONDS:-180}
      REPOMATE_TOOL_MAX_RESULTS: ${REPOMATE_TOOL_MAX_RESULTS:-20}
    volumes:
      - repomate-runs:/var/lib/repomate
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repomate
      POSTGRES_USER: repomate
      # Local-development default so ``docker compose up`` works with no
      # environment at all. Set POSTGRES_PASSWORD (or use an external managed
      # database) before exposing this stack beyond your machine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomate-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomate -d repomate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - repomate-db:/var/lib/postgresql/data
    # Point services at PostgreSQL with:
    #   REPOMATE_DATABASE_URL=postgresql://repomate:${POSTGRES_PASSWORD:-repomate-dev}@postgres:5432/repomate

volumes:
  repomate-runs:
  repomate-db:
