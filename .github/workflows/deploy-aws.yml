# trigger
name: Deploy AWS app

# Full-stack deploy chain: CI -> ECR images (api, worker, web) -> Terraform
# apply -> health gate on both the frontend and the API.
#
# The Next.js service is part of the same ALB, so image_web must always resolve
# to a real tag: with an empty image_web the stack's web_enabled local goes false
# and Terraform destroys the frontend service it is already running.
#
# Authentication is OIDC: the workflow assumes the role created in AWS and trusts
# only this repository's `production` environment, so no long-lived AWS key
# lives in GitHub.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/**
      - services/**
      - scripts/**
      - apps/web/**
      - deploy/**
      - pyproject.toml
      - .dockerignore
      - .github/workflows/ci.yml
      - .github/workflows/deploy-aws.yml

# Pull requests are gated by ci.yml instead: a plan needs the environment's
# variables and an image to plan against, neither of which a fork run has.

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.16.6"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::513594860857:role/repomate-github-deployments' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # provenance=false on purpose: buildkit otherwise pushes an OCI index with
      # attestation entries, and ECS image pulling through that index has burned
      # us before. A plain single-manifest image is what Fargate expects.
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: ${{ steps.ecr.outputs.registry }}/repomate/api:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          tags: ${{ steps.ecr.outputs.registry }}/repomate/worker:${{ github.sha }}

      - name: Create the web repository if this is its first build
        run: |
          aws ecr describe-repositories --repository-names repomate/web \
            || aws ecr create-repository --repository-name repomate/web

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: ${{ steps.ecr.outputs.registry }}/repomate/web:${{ github.sha }}

  infrastructure:
    name: Plan and apply
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Require configuration
        run: |
          if [ -z "${ALLOWED_ORIGINS}" ]; then
            echo "::notice::ALLOWED_ORIGINS not set; defaulting to https://repomate.vercel.app"
          fi
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://repomate.vercel.app' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::513594860857:role/repomate-github-deployments' }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: deploy/aws
        run: terraform init -input=false -no-color

      # The images job pushed exactly these tags. Rebuilding the reference from
      # the caller identity is simpler than passing it between jobs (job outputs
      # cannot read the steps context) and cannot drift to another tag.
      - name: Resolve the images just pushed
        id: images
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          api="$acct.dkr.ecr.$AWS_REGION.amazonaws.com/repomate/api:$GITHUB_SHA"
          worker="$acct.dkr.ecr.$AWS_REGION.amazonaws.com/repomate/worker:$GITHUB_SHA"
          web="$acct.dkr.ecr.$AWS_REGION.amazonaws.com/repomate/web:$GITHUB_SHA"
          # An empty image_web silently destroys the running frontend service,
          # so refuse to plan with a half-resolved image set.
          for image in api worker web; do
            if [ -z "${!image}" ]; then
              echo "::error::could not resolve the $image image reference"
              exit 1
            fi
          done
          {
            echo "api=$api"
            echo "worker=$worker"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        id: plan
        working-directory: deploy/aws
        run: |
          terraform plan -input=false -no-color \
            -var "image_api=${{ steps.images.outputs.api }}" \
            -var "image_worker=${{ steps.images.outputs.worker }}" \
            -var "image_web=${{ steps.images.outputs.web }}" \
            -var "allowed_origins=${{ vars.ALLOWED_ORIGINS || 'https://repomate.vercel.app' }}" \
            -out tfplan | tee plan.log
          {
            echo '### Terraform plan'
            echo '```'
            tail -n 40 plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A dispatch from a non-main branch only proves the change plans cleanly.
      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        id: apply
        working-directory: deploy/aws
        run: |
          terraform apply -input=false -no-color tfplan
          {
            echo "api_url=$(terraform output -raw api_url)"
            echo "web_url=$(terraform output -raw web_url)"
          } >> "$GITHUB_OUTPUT"
          echo "Deployed app: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the services to settle
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs wait services-stable --cluster repomate-cluster \
            --services repomate-api repomate-worker repomate-web

      - name: Gate on the deployed API reporting healthy
        if: github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ steps.apply.outputs.api_url }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::terraform did not emit an api_url output"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 40 --retry-delay 10 \
            --retry-connrefused "$API_URL/api/health" | tee /tmp/health.json
          echo '### Health' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The bundle is built with an empty NEXT_PUBLIC_API_URL so it fetches
      # relative /api/* paths off the same origin. If a localhost URL ever leaks
      # into the served HTML or a chunk, the frontend would be talking to the
      # visitor's own machine, so fail the deploy instead of shipping that.
      - name: Gate on the deployed frontend
        if: github.ref == 'refs/heads/main'
        env:
          WEB_URL: ${{ steps.apply.outputs.web_url }}
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::error::terraform did not emit a web_url output"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 40 --retry-delay 10 \
            --retry-connrefused "$WEB_URL/" -o /tmp/index.html
          grep -q '<title' /tmp/index.html
          if grep -q 'localhost:8000' /tmp/index.html; then
            echo "::error::the served bundle still points at localhost:8000"
            exit 1
          fi
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "Served $(wc -c < /tmp/index.html) bytes from $WEB_URL with same-origin /api/* calls." \
            >> "$GITHUB_STEP_SUMMARY"

      # NEXT_PUBLIC_* is baked into the bundle at build time, so the frontend
      # only follows the API after a rebuild. Dispatch the Vercel workflow with
      # this apply's URL as an input rather than mutating a repo variable.
      - name: Rebuild the Vercel copy against the new API
        if: github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ steps.apply.outputs.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::terraform did not emit an api_url output"
            exit 1
          fi
          curl -fsS -X POST \
            -H "authorization: Bearer $GITHUB_TOKEN" \
            -H 'accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-vercel.yml/dispatches" \
            --data "{\"ref\":\"main\",\"inputs\":{\"api_url\":\"$API_URL\"}}"
