[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomate"
version = "0.1.0"
description = "RepoMate — evidence-first open-source contribution agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["repomate_core*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires internet access and clones a real GitHub repository (opt in with -m network)",
]
addopts = "-m 'not network'"
